<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fff8f6" />
    <meta
      name="description"
      content="Портфолио Екатерины Королёвой — UI/UX-дизайн, интерактивные прототипы, дизайн-системы и фронтенд."
    />
    <meta property="og:title" content="Екатерина Королёва — UI/UX-дизайнер" />
    <meta
      property="og:description"
      content="UI/UX, прототипирование, визуальный дизайн и фронтенд-разработка."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/media/profile/ProfilePhoto.webp" />
    <link
      rel="icon"
      href="/media/logo/ЛогоИконкаВекторЖелтый.svg"
      type="image/svg+xml"
    />
    <link
      rel="apple-touch-icon"
      href="/media/logo/ЛогоИконкаВекторБелый.svg"
    />
    <title>Екатерина Королёва — UI/UX-дизайнер</title>
  </head>
  <body>
    <div id="root">
      <section
        id="file-help"
        style="
          display: none;
          min-height: 100vh;
          padding: 48px 24px;
          place-items: center;
          background: #fff8f6;
          color: #382a2c;
          font-family: Arial, sans-serif;
        "
      >
        <div style="max-width: 680px">
          <p
            style="
              font-size: 12px;
              font-weight: 700;
              letter-spacing: 0.12em;
              text-transform: uppercase;
            "
          >
            Екатерина Королёва · Портфолио
          </p>
          <h1
            style="
              margin: 20px 0;
              font:
                400 clamp(42px, 8vw, 82px) / 1.05 Georgia,
                serif;
            "
          >
            Сайту нужен локальный сервер
          </h1>
          <p style="font-size: 18px; line-height: 1.6">
            React-проект нельзя запустить двойным кликом по
            <code>index.html</code>. Откройте файл
            <strong>start-portfolio.command</strong> в этой же папке — он сам
            запустит сайт и откроет браузер.
          </p>
          <a
            href="http://127.0.0.1:5173/"
            style="
              display: inline-block;
              margin-top: 24px;
              padding: 15px 20px;
              border-radius: 999px;
              background: #382a2c;
              color: #fff;
              text-decoration: none;
              font-weight: 700;
            "
            >Открыть после запуска →</a
          >
        </div>
      </section>
    </div>
    <script>
      if (location.protocol === "file:") {
        document.getElementById("file-help").style.display = "grid";
      }
    </script>
    <script type="module">
      if (location.protocol !== "file:") import("/src/main.jsx");
    </script>
  </body>
</html>
